<html>
    <head>
        <title>Karinderya</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
    </head>
<body class="dbody">
    <div class="category-tabs">
    <a href="#meat-section" class="tab-btn">Meat</a>
    <a href="#veggies-section" class="tab-btn">Veggies</a>
    <a href="#fried-section" class="tab-btn">Fried Dish</a>
    <a href="#soup-section" class="tab-btn">Soup</a>
  </div>

  <!-- Food Display Panel Grid Area -->
  <div class="menu-display-panel">

    <!-- Default Landing Message (Disappears once a section is chosen) -->
    <div id="default-message">
      <p>Please select a menu category above to view dishes.</p>
    </div>

    <!-- 1. MEAT PANEL -->
    <div id="meat-section" class="menu-grid">
      <div class="food-card">
        <img src="giniling.jpg" alt="Giniling" class="food-img">
        <div class="food-name">GINILING</div>
      </div>
      <div class="food-card">
        <img src="chicken-adobo.jpg" alt="Chicken Adobo" class="food-img">
        <div class="food-name">CHICKEN ADOBO</div>
      </div>
      <div class="food-card">
        <img src="menudo.jpg" alt="Menudo" class="food-img">
        <div class="food-name">MENUDO</div>
      </div>
      <div class="food-card">
        <img src="bopis.jpg" alt="Bopis" class="food-img">
        <div class="food-name">BOPIS</div>
      </div>
      <div class="food-card">
        <img src="sisig.jpg" alt="Sisig" class="food-img">
        <div class="food-name">SISIG</div>
      </div>
    </div>

    <!-- 2. VEGGIES PANEL -->
    <div id="veggies-section" class="menu-grid">
      <div class="food-card">
        <img src="adobong-kangkong.jpg" alt="Adobong Kangkong" class="food-img">
        <div class="food-name">ADOBONG KANGKONG</div>
      </div>
      <div class="food-card">
        <img src="chapsuy.jpg" alt="Chapsuy" class="food-img">
        <div class="food-name">CHAPSUY</div>
      </div>
      <div class="food-card">
        <img src="ginisang-amplaya.jpg" alt="Ginisang Ampalaya" class="food-img">
        <div class="food-name">GINISANG AMPLAYA</div>
      </div>
      <div class="food-card">
        <img src="ginisang-petchay.jpg" alt="Ginisang Petchay" class="food-img">
        <div class="food-name">GINISANG PETCHAY</div>
      </div>
      <div class="food-card">
        <img src="langka.jpg" alt="Langka" class="food-img">
        <div class="food-name">LANGKA</div>
      </div>
    </div>

    <!-- 3. FRIED DISH PANEL -->
    <div id="fried-section" class="menu-grid">
      <div class="food-card">
        <img src="hotdog-egg.jpg" alt="Hotdog with Egg" class="food-img">
        <div class="food-name">HOTDOG/EGG</div>
      </div>
      <div class="food-card">
        <img src="tilapia.jpg" alt="Pritong Tilapia" class="food-img">
        <div class="food-name">PRITONG TILAPIA</div>
      </div>
      <div class="food-card">
        <img src="galunggong.jpg" alt="Pritong Galunggong" class="food-img">
        <div class="food-name">PRITONG GALUNGGONG</div>
      </div>
      <div class="food-card">
        <img src="lumpia.jpg" alt="Lumpia" class="food-img">
        <div class="food-name">LUMPIA</div>
      </div>
    </div>

    <!-- 4. SOUP PANEL -->
    <div id="soup-section" class="menu-grid">
      <div class="food-card">
        <img src="sinigang.jpg" alt="Sinigang na Baboy" class="food-img">
        <div class="food-name">SINIGANG NA BABOY</div>
      </div>
    </div>

  </div>

</body>
</html>
